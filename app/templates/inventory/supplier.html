{% extends "base.html" %}

{% block title %}供应商管理{% endblock %}

{% block content %}
<div class="header">
    <h2>供应商管理</h2>
    <button class="btn btn-primary" onclick="showCreateSupplierModal()">+ 新增供应商</button>
</div>

<div class="content-box">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索供应商名称、编码...">
        <button class="btn btn-success" onclick="searchSuppliers()">查询</button>
    </div>
    
    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>供应商编码</th>
                    <th>供应商名称</th>
                    <th>联系人</th>
                    <th>联系电话</th>
                    <th>邮箱</th>
                    <th>地址</th>
                    <th>信用额度</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="supplierTableBody">
                <!-- 数据将通过JavaScript加载 -->
            </tbody>
        </table>
    </div>
    
    <div class="pagination" id="pagination">
        <!-- 分页将通过JavaScript生成 -->
    </div>
</div>

<!-- 新增/编辑供应商模态框 -->
<div class="modal" id="supplierModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">新增供应商</h3>
            <span class="close" onclick="closeSupplierModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="supplierForm">
                <div class="form-group">
                    <label>供应商编码 *</label>
                    <input type="text" id="supplierCode" name="code" required>
                </div>
                <div class="form-group">
                    <label>供应商名称 *</label>
                    <input type="text" id="supplierName" name="name" required>
                </div>
                <div class="form-group">
                    <label>联系人</label>
                    <input type="text" id="contactPerson" name="contact_person">
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="text" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <textarea id="address" name="address" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>税号</label>
                    <input type="text" id="taxNumber" name="tax_number">
                </div>
                <div class="form-group">
                    <label>银行账户</label>
                    <input type="text" id="bankAccount" name="bank_account">
                </div>
                <div class="form-group">
                    <label>开户银行</label>
                    <input type="text" id="bankName" name="bank_name">
                </div>
                <div class="form-group">
                    <label>付款条件</label>
                    <input type="text" id="paymentTerms" name="payment_terms">
                </div>
                <div class="form-group">
                    <label>信用额度</label>
                    <input type="number" id="creditLimit" name="credit_limit" step="0.01" min="0">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeSupplierModal()">取消</button>
            <button class="btn btn-primary" onclick="saveSupplier()">保存</button>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentSupplierId = null;

// 页面加载时获取供应商列表
document.addEventListener('DOMContentLoaded', function() {
    loadSuppliers();
});

// 加载供应商列表
function loadSuppliers(page = 1) {
    const search = document.getElementById('searchInput').value;
    const params = new URLSearchParams({
        page: page,
        per_page: 20,
        search: search
    });
    
    fetch(`/inventory/api/supplier/list?${params}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderSupplierTable(data.data);
                renderPagination(data.total, page);
                currentPage = page;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('加载供应商列表失败');
        });
}

// 渲染供应商表格
function renderSupplierTable(suppliers) {
    const tbody = document.getElementById('supplierTableBody');
    tbody.innerHTML = '';
    
    suppliers.forEach(supplier => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${supplier.code || ''}</td>
            <td>${supplier.name || ''}</td>
            <td>${supplier.contact_person || ''}</td>
            <td>${supplier.phone || ''}</td>
            <td>${supplier.email || ''}</td>
            <td>${supplier.address || ''}</td>
            <td>${supplier.credit_limit || 0}</td>
            <td><span class="status ${supplier.is_active ? 'active' : 'inactive'}">${supplier.is_active ? '启用' : '禁用'}</span></td>
            <td>
                <button class="btn btn-sm btn-primary" onclick="editSupplier(${supplier.id})">编辑</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// 渲染分页
function renderPagination(total, currentPage) {
    const totalPages = Math.ceil(total / 20);
    const pagination = document.getElementById('pagination');
    
    let html = '';
    if (totalPages > 1) {
        html += `<button class="btn btn-sm" onclick="loadSuppliers(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;
        
        for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
                html += `<button class="btn btn-sm btn-primary">${i}</button>`;
            } else {
                html += `<button class="btn btn-sm" onclick="loadSuppliers(${i})">${i}</button>`;
            }
        }
        
        html += `<button class="btn btn-sm" onclick="loadSuppliers(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
    }
    
    pagination.innerHTML = html;
}

// 搜索供应商
function searchSuppliers() {
    loadSuppliers(1);
}

// 显示新增供应商模态框
function showCreateSupplierModal() {
    currentSupplierId = null;
    document.getElementById('modalTitle').textContent = '新增供应商';
    document.getElementById('supplierForm').reset();
    document.getElementById('supplierModal').style.display = 'block';
}

// 编辑供应商
function editSupplier(supplierId) {
    currentSupplierId = supplierId;
    document.getElementById('modalTitle').textContent = '编辑供应商';
    
    // 获取供应商详情并填充表单
    fetch(`/inventory/api/supplier/${supplierId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const supplier = data.data;
                document.getElementById('supplierCode').value = supplier.code || '';
                document.getElementById('supplierName').value = supplier.name || '';
                document.getElementById('contactPerson').value = supplier.contact_person || '';
                document.getElementById('phone').value = supplier.phone || '';
                document.getElementById('email').value = supplier.email || '';
                document.getElementById('address').value = supplier.address || '';
                document.getElementById('taxNumber').value = supplier.tax_number || '';
                document.getElementById('bankAccount').value = supplier.bank_account || '';
                document.getElementById('bankName').value = supplier.bank_name || '';
                document.getElementById('paymentTerms').value = supplier.payment_terms || '';
                document.getElementById('creditLimit').value = supplier.credit_limit || 0;
                
                document.getElementById('supplierModal').style.display = 'block';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('获取供应商详情失败');
        });
}

// 关闭供应商模态框
function closeSupplierModal() {
    document.getElementById('supplierModal').style.display = 'none';
}

// 保存供应商
function saveSupplier() {
    const formData = {
        code: document.getElementById('supplierCode').value,
        name: document.getElementById('supplierName').value,
        contact_person: document.getElementById('contactPerson').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        address: document.getElementById('address').value,
        tax_number: document.getElementById('taxNumber').value,
        bank_account: document.getElementById('bankAccount').value,
        bank_name: document.getElementById('bankName').value,
        payment_terms: document.getElementById('paymentTerms').value,
        credit_limit: parseFloat(document.getElementById('creditLimit').value) || 0
    };
    
    const url = currentSupplierId ? `/inventory/api/supplier/${currentSupplierId}` : '/inventory/api/supplier/create';
    const method = currentSupplierId ? 'PUT' : 'POST';
    
    fetch(url, {
        method: method,
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('保存成功');
            closeSupplierModal();
            loadSuppliers(currentPage);
        } else {
            alert('保存失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败');
    });
}

// 点击模态框外部关闭
window.onclick = function(event) {
    const modal = document.getElementById('supplierModal');
    if (event.target === modal) {
        closeSupplierModal();
    }
}
</script>
{% endblock %}
