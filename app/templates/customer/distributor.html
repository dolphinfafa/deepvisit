{% extends "base.html" %}

{% block title %}直营商管理{% endblock %}

{% block content %}
<div class="header">
    <h2>直营商管理</h2>
    <button class="btn btn-primary" onclick="showCreateModal()">+ 新增直营商</button>
</div>

<div class="content-box">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索直营商名称、编码、手机号、营业执照名称、工商注册号..." onkeyup="searchCustomers()">
        <button class="btn btn-success" onclick="loadData()">查询</button>
    </div>
    
    <div class="table-responsive">
        <table class="table" id="dataTable">
            <thead>
                <tr>
                    <th>经销商编码</th>
                    <th>经销商名称</th>
                    <th>经销商类型</th>
                    <th>详细地址</th>
                    <th>客户经理</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 40px;">加载中...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div class="pagination" id="pagination"></div>
</div>

<div class="modal" id="createModal">
    <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
        <h3>新增直营商</h3>
        <form id="createForm">
            <div class="horizontal-layout">
                <!-- 基本信息 -->
                <div class="form-group">
                    <label>直营商名称 *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>直营商客户编码 *</label>
                    <input type="text" name="code" required>
                </div>
                <div class="form-group">
                    <label>直营商类型</label>
                    <select name="type">
                        <option value="经销商">经销商</option>
                        <option value="代理商">代理商</option>
                        <option value="批发商">批发商</option>
                        <option value="零售商">零售商</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>客户等级</label>
                    <select name="level">
                        <option value="A">A级</option>
                        <option value="B">B级</option>
                        <option value="C">C级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>客户经理</label>
                    <select name="manager_id">
                        <option value="">请选择客户经理</option>
                        <option value="1">张三</option>
                        <option value="2">李四</option>
                        <option value="3">王五</option>
                        <option value="4">赵六</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>客户协助员</label>
                    <select name="assistant_id">
                        <option value="">请选择客户协助员</option>
                        <option value="1">张三</option>
                        <option value="2">李四</option>
                        <option value="3">王五</option>
                        <option value="4">赵六</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>销售区域</label>
                    <select name="sales_area">
                        <option value="">请选择销售区域</option>
                        <option value="华北区">华北区</option>
                        <option value="华东区">华东区</option>
                        <option value="华南区">华南区</option>
                        <option value="华中区">华中区</option>
                        <option value="西南区">西南区</option>
                        <option value="西北区">西北区</option>
                        <option value="东北区">东北区</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>直营商标签</label>
                    <select name="tags">
                        <option value="">请选择直营商标签</option>
                        <option value="重点客户">重点客户</option>
                        <option value="VIP客户">VIP客户</option>
                        <option value="普通客户">普通客户</option>
                        <option value="潜在客户">潜在客户</option>
                        <option value="流失客户">流失客户</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>供货商</label>
                    <select name="supplier">
                        <option value="">请选择供货商</option>
                        <option value="供应商A">供应商A</option>
                        <option value="供应商B">供应商B</option>
                        <option value="供应商C">供应商C</option>
                        <option value="供应商D">供应商D</option>
                        <option value="供应商E">供应商E</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>合作状态</label>
                    <select name="cooperation_status">
                        <option value="合作中">合作中</option>
                        <option value="暂停合作">暂停合作</option>
                        <option value="终止合作">终止合作</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" name="phone">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea name="remark" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>拜访频率</label>
                    <select name="visit_frequency">
                        <option value="每天">每天</option>
                        <option value="每周">每周</option>
                        <option value="每月">每月</option>
                        <option value="每季度">每季度</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>审批状态</label>
                    <select name="approval_status">
                        <option value="pending">待审批</option>
                        <option value="approved">已通过</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                </div>
                
                <!-- 营业执照信息 -->
                <div class="form-group">
                    <label>营业执照</label>
                    <input type="file" name="business_license" accept="image/*" onchange="previewImage(this)">
                    <div id="license-preview" style="margin-top: 10px;"></div>
                </div>
                <div class="form-group">
                    <label>营业执照名称</label>
                    <input type="text" name="license_name">
                </div>
                <div class="form-group">
                    <label>工商注册号</label>
                    <input type="text" name="registration_no">
                </div>
                <div class="form-group">
                    <label>注册日期</label>
                    <input type="date" name="registration_date">
                </div>
                <div class="form-group">
                    <label>经营者</label>
                    <input type="text" name="operator">
                </div>
                
                <!-- 收货信息 -->
                <div class="form-group">
                    <label>收货人姓名</label>
                    <input type="text" name="receiver_name">
                </div>
                <div class="form-group">
                    <label>收货人手机号</label>
                    <input type="text" name="receiver_phone">
                </div>
                <div class="form-group">
                    <label>收货地址</label>
                    <input type="text" name="receiver_address">
                </div>
                <div class="form-group">
                    <label>详细地址</label>
                    <input type="text" name="detail_address">
                </div>
                
                <!-- 联系人信息 -->
                <div class="form-group">
                    <label>联系人姓名</label>
                    <input type="text" name="contact_name">
                </div>
                <div class="form-group">
                    <label>联系人手机号</label>
                    <input type="text" name="contact_phone">
                </div>
            </div>
            <div style="display: flex; gap: 16px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="button" class="btn" onclick="closeModal()" style="background: #95a5a6; color: white;">取消</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/list-common.js') }}"></script>
<script>
    const API_LIST = '/customer/api/distributor/list';
    const API_CREATE = '/customer/api/distributor/create';
    const API_DELETE = '/customer/api/distributor/';
    
    async function loadData(page = 1) {
        const search = document.getElementById('searchInput').value;
        const data = await fetchAPI(`${API_LIST}?page=${page}&search=${search}`);
        
        if (data && data.success) {
            renderTable(data.data);
            renderPagination(data.total, data.per_page || 20, page);
        }
    }
    
    function renderTable(items) {
        const tbody = document.getElementById('tableBody');
        
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">暂无数据</td></tr>';
            return;
        }
        
        tbody.innerHTML = items.map(item => `
            <tr>
                <td>${item.code || '-'}</td>
                <td>${item.name || '-'}</td>
                <td>${item.type || '-'}</td>
                <td>${item.detail_address || '-'}</td>
                <td>${item.manager || '-'}</td>
                <td>${formatDate(item.created_at)}</td>
                <td>
                    <button class="btn" style="padding: 8px 16px; font-size: 14px;" onclick="viewDetail(${item.id})">详情</button>
                    <button class="btn btn-danger" style="padding: 8px 16px; font-size: 14px;" onclick="deleteItem(${item.id})">删除</button>
                </td>
            </tr>
        `).join('');
    }
    
    function viewDetail(id) {
        window.location.href = `/customer/distributor/${id}`;
    }
    
    function deleteItem(id) {
        if (!confirm('确定要删除这个经销商吗？')) return;
        
        fetch(`${API_DELETE}${id}`, {
            method: 'DELETE'
        }).then(response => response.json())
        .then(data => {
            if (data.success) {
                showMessage('删除成功');
                loadData();
            } else {
                showMessage('删除失败: ' + data.message);
            }
        });
    }
    
    function renderPagination(total, perPage, current) {
        const totalPages = Math.ceil(total / perPage);
        const pagination = document.getElementById('pagination');
        
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
        }
        
        pagination.innerHTML = html;
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        return new Date(dateStr).toLocaleDateString('zh-CN');
    }
    
    function getStatusBadge(status) {
        const statusMap = {
            'pending': '<span class="badge badge-warning">待审批</span>',
            'approved': '<span class="badge badge-success">已通过</span>',
            'rejected': '<span class="badge badge-danger">已拒绝</span>'
        };
        return statusMap[status] || '<span class="badge badge-info">未知</span>';
    }
    
    function showCreateModal() {
        document.getElementById('createModal').classList.add('show');
    }
    
    function closeModal() {
        document.getElementById('createModal').classList.remove('show');
        document.getElementById('createForm').reset();
    }
    
    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        const result = await fetchAPI(API_CREATE, {
            method: 'POST',
            body: formData
        });
        
        if (result && result.success) {
            showMessage('创建成功');
            closeModal();
            loadData();
        }
    });
    
    function searchCustomers() {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => loadData(1), 500);
    }
    
    function previewImage(input) {
        const preview = document.getElementById('license-preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = '<img src="' + e.target.result + '" style="max-width: 200px; max-height: 150px; border: 1px solid #ddd; border-radius: 4px;">';
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.innerHTML = '';
        }
    }
    
    loadData();
</script>
{% endblock %}
