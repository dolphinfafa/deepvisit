{% extends "base.html" %}

{% block title %}编辑活动{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="card-title">编辑活动</h3>
                        <a href="{{ url_for('activity.center') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> 返回活动中心
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="form-group">
                            <label for="name">活动名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ activity.name }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="description">活动描述</label>
                            <textarea class="form-control" id="description" name="description" rows="4" 
                                      placeholder="请输入活动描述...">{{ activity.description }}</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="status">活动状态</label>
                            <select class="form-control" id="status" name="status">
                                <option value="active" {% if activity.status == 'active' %}selected{% endif %}>活跃</option>
                                <option value="inactive" {% if activity.status == 'inactive' %}selected{% endif %}>非活跃</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 更新活动
                            </button>
                            <a href="{{ url_for('activity.center') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> 取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
