{% extends "base.html" %}

{% block title %}拜访计划管理{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">拜访计划管理</h3>
                    <div class="card-tools">
                        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#addPlanModal">
                            <i class="fas fa-plus"></i> 新增拜访计划
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <!-- 筛选条件 -->
                    <div class="search-bar">
                        <select id="visitorFilter">
                            <option value="">全部拜访人</option>
                        </select>
                        <select id="approvalStatusFilter">
                            <option value="">全部审批状态</option>
                            <option value="pending">待审批</option>
                            <option value="approved">已审批</option>
                            <option value="rejected">已拒绝</option>
                        </select>
                        <input type="date" id="startDateFilter" placeholder="开始日期">
                        <input type="date" id="endDateFilter" placeholder="结束日期">
                        <button type="button" class="btn btn-info" onclick="loadPlanList()">
                            <i class="fas fa-search"></i> 查询
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetFilters()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                    </div>

                    <!-- 数据表格 -->
                    <div class="table-responsive">
                        <table class="table" id="planTable">
                            <thead>
                                <tr>
                                    <th>拜访人</th>
                                    <th>拜访客户</th>
                                    <th>拜访日期</th>
                                    <th>拜访内容</th>
                                    <th>审批进度</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="planTableBody">
                                <!-- 数据将通过JavaScript动态加载 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 分页 -->
                    <div class="row">
                        <div class="col-sm-12 col-md-5">
                            <div class="dataTables_info" id="planTable_info" role="status" aria-live="polite">
                                显示第 1 到 20 条，共 0 条记录
                            </div>
                        </div>
                        <div class="col-sm-12 col-md-7">
                            <div class="dataTables_paginate paging_simple_numbers" id="planTable_paginate">
                                <ul class="pagination" id="pagination">
                                    <!-- 分页按钮将通过JavaScript动态生成 -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新增拜访计划模态框 -->
<div class="modal fade" id="addPlanModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增拜访计划</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="addPlanForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="visitorSelect">拜访人 <span class="text-danger">*</span></label>
                                <select class="form-control" id="visitorSelect" name="visitor_id" required>
                                    <option value="">请选择拜访人</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="customerType">客户类型 <span class="text-danger">*</span></label>
                                <select class="form-control" id="customerType" name="customer_type" required>
                                    <option value="">请选择客户类型</option>
                                    <option value="terminal">终端客户</option>
                                    <option value="distributor">直营商客户</option>
                                    <option value="kol">KOL客户</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="customerId">客户ID <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="customerId" name="customer_id" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="customerName">客户名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="customerName" name="customer_name" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="visitDate">拜访日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="visitDate" name="visit_date" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="startTime">开始时间</label>
                                <input type="time" class="form-control" id="startTime" name="start_time">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="endTime">结束时间</label>
                                <input type="time" class="form-control" id="endTime" name="end_time">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="isPeriodic">是否周期性</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="isPeriodic" name="is_periodic">
                                    <label class="form-check-label" for="isPeriodic">
                                        是
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="planContent">拜访内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="planContent" name="plan_content" rows="4" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;

$(document).ready(function() {
    loadUsers();
    loadPlanList();
    
    // 新增拜访计划表单提交
    $('#addPlanForm').on('submit', function(e) {
        e.preventDefault();
        createPlan();
    });
});

// 加载用户列表
function loadUsers() {
    $.get('/visit/api/users/list', function(response) {
        if (response.success) {
            const visitorSelect = $('#visitorSelect');
            const visitorFilter = $('#visitorFilter');
            
            response.data.forEach(user => {
                visitorSelect.append(`<option value="${user.id}">${user.name} (${user.department || '无部门'})</option>`);
                visitorFilter.append(`<option value="${user.id}">${user.name}</option>`);
            });
        }
    });
}

// 加载拜访计划列表
function loadPlanList(page = 1) {
    const params = {
        page: page,
        per_page: 20,
        visitor_id: $('#visitorFilter').val(),
        approval_status: $('#approvalStatusFilter').val(),
        start_date: $('#startDateFilter').val(),
        end_date: $('#endDateFilter').val()
    };
    
    $.get('/visit/api/plan/list', params, function(response) {
        if (response.success) {
            renderPlanTable(response.data);
            updatePagination(response.total, page);
            currentPage = page;
        } else {
            showAlert('加载数据失败', 'error');
        }
    });
}

// 渲染表格数据
function renderPlanTable(data) {
    const tbody = $('#planTableBody');
    tbody.empty();
    
    if (data.length === 0) {
        tbody.append('<tr><td colspan="7" class="text-center">暂无数据</td></tr>');
        return;
    }
    
    data.forEach(plan => {
        const approvalStatusBadge = getApprovalStatusBadge(plan.approval_status);
        const visitDate = plan.visit_date ? new Date(plan.visit_date).toLocaleDateString() : '-';
        const createdDate = plan.created_at ? new Date(plan.created_at).toLocaleDateString() : '-';
        
        tbody.append(`
            <tr>
                <td>${plan.visitor || '-'}</td>
                <td>${plan.customer_name || '-'}</td>
                <td>${visitDate}</td>
                <td>${plan.plan_content || '-'}</td>
                <td>${approvalStatusBadge}</td>
                <td>${createdDate}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="viewPlan(${plan.id})" style="padding: 8px 16px; font-size: 14px;">
                        <i class="fas fa-eye"></i> 查看
                    </button>
                </td>
            </tr>
        `);
    });
}

// 获取审批状态标签
function getApprovalStatusBadge(status) {
    const statusMap = {
        'pending': '<span class="badge badge-warning">待审批</span>',
        'approved': '<span class="badge badge-success">已审批</span>',
        'rejected': '<span class="badge badge-danger">已拒绝</span>'
    };
    return statusMap[status] || '<span class="badge badge-secondary">未知</span>';
}

// 更新分页
function updatePagination(total, currentPage) {
    const perPage = 20;
    totalPages = Math.ceil(total / perPage);
    
    const pagination = $('#pagination');
    pagination.empty();
    
    // 上一页
    if (currentPage > 1) {
        pagination.append(`<li class="page-item"><a class="page-link" href="#" onclick="loadPlanList(${currentPage - 1})">上一页</a></li>`);
    }
    
    // 页码
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        const activeClass = i === currentPage ? 'active' : '';
        pagination.append(`<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="loadPlanList(${i})">${i}</a></li>`);
    }
    
    // 下一页
    if (currentPage < totalPages) {
        pagination.append(`<li class="page-item"><a class="page-link" href="#" onclick="loadPlanList(${currentPage + 1})">下一页</a></li>`);
    }
    
    // 更新信息
    const start = (currentPage - 1) * perPage + 1;
    const end = Math.min(currentPage * perPage, total);
    $('#planTable_info').text(`显示第 ${start} 到 ${end} 条，共 ${total} 条记录`);
}

// 创建拜访计划
function createPlan() {
    const formData = {
        visitor_id: $('#visitorSelect').val(),
        customer_type: $('#customerType').val(),
        customer_id: $('#customerId').val(),
        customer_name: $('#customerName').val(),
        visit_date: $('#visitDate').val(),
        start_time: $('#startTime').val(),
        end_time: $('#endTime').val(),
        plan_content: $('#planContent').val(),
        is_periodic: $('#isPeriodic').is(':checked')
    };
    
    $.ajax({
        url: '/visit/api/plan/create',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function(response) {
            if (response.success) {
                showAlert('创建成功', 'success');
                $('#addPlanModal').modal('hide');
                $('#addPlanForm')[0].reset();
                loadPlanList(currentPage);
            } else {
                showAlert(response.message || '创建失败', 'error');
            }
        },
        error: function() {
            showAlert('创建失败', 'error');
        }
    });
}

// 重置筛选条件
function resetFilters() {
    $('#visitorFilter').val('');
    $('#approvalStatusFilter').val('');
    $('#startDateFilter').val('');
    $('#endDateFilter').val('');
    loadPlanList(1);
}

// 查看计划详情
function viewPlan(planId) {
    // 这里可以添加查看详情的功能
    showAlert('查看详情功能待实现', 'info');
}

// 显示提示信息
function showAlert(message, type) {
    const alertClass = type === 'success' ? 'alert-success' : 
                      type === 'error' ? 'alert-danger' : 'alert-info';
    
    const alertHtml = `
        <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        </div>
    `;
    
    $('.container-fluid').prepend(alertHtml);
    
    // 3秒后自动消失
    setTimeout(function() {
        $('.alert').fadeOut();
    }, 3000);
}
</script>
{% endblock %}
