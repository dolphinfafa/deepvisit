{% extends "base.html" %}

{% block title %}编辑库存上报{% endblock %}

{% block content %}
<div class="header">
    <h2>编辑库存上报</h2>
    <div class="user-info">
        <a href="{{ url_for('data_report.inventory_list') }}" class="btn btn-secondary">返回列表</a>
    </div>
</div>

<div class="content-box">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST">
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="customer_name">客户名称 <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="customer_name" name="customer_name" 
                       value="{{ report.customer_name }}" required>
            </div>
            
            <div class="form-group">
                <label for="product_code">商品编码</label>
                <input type="text" class="form-control" id="product_code" name="product_code" 
                       value="{{ report.product_code or '' }}">
            </div>
        </div>
        
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="product_name">商品名称 <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="product_name" name="product_name" 
                       value="{{ report.product_name }}" required>
            </div>
            
            <div class="form-group">
                <label for="specification">规格</label>
                <input type="text" class="form-control" id="specification" name="specification" 
                       value="{{ report.specification or '' }}">
            </div>
            
            <div class="form-group">
                <label for="quantity">库存数量 <span style="color: red;">*</span></label>
                <input type="number" class="form-control" id="quantity" name="quantity" 
                       value="{{ report.quantity }}" min="0" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="remark">备注</label>
            <textarea class="form-control" id="remark" name="remark" rows="3">{{ report.remark or '' }}</textarea>
        </div>
        
        <div class="form-group" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="margin-right: 10px;">保存</button>
            <a href="{{ url_for('data_report.inventory_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
