{% extends "base.html" %}

{% block title %}编辑铺货上报{% endblock %}

{% block content %}
<div class="header">
    <h2>编辑铺货上报</h2>
    <div class="user-info">
        <a href="{{ url_for('data_report.display_list') }}" class="btn btn-secondary">返回列表</a>
    </div>
</div>

<div class="content-box">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST">
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="report_date">上报日期 <span style="color: red;">*</span></label>
                <input type="date" class="form-control" id="report_date" name="report_date" 
                       value="{{ report.report_date.strftime('%Y-%m-%d') if report.report_date else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="customer_type">客户类型</label>
                <select class="form-control" id="customer_type" name="customer_type">
                    <option value="">请选择</option>
                    <option value="terminal" {% if report.customer_type == 'terminal' %}selected{% endif %}>终端客户</option>
                    <option value="distributor" {% if report.customer_type == 'distributor' %}selected{% endif %}>直营商</option>
                    <option value="kol" {% if report.customer_type == 'kol' %}selected{% endif %}>KOL</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="customer_name">客户名称 <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="customer_name" name="customer_name" 
                       value="{{ report.customer_name }}" required>
            </div>
        </div>
        
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="customer_level">客户等级</label>
                <input type="text" class="form-control" id="customer_level" name="customer_level" 
                       value="{{ report.customer_level or '' }}">
            </div>
            
            <div class="form-group">
                <label for="customer_manager">客户经理</label>
                <input type="text" class="form-control" id="customer_manager" name="customer_manager" 
                       value="{{ report.customer_manager or '' }}">
            </div>
        </div>
        
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="product_code">商品编码 <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="product_code" name="product_code" 
                       value="{{ report.product_code }}" required>
            </div>
            
            <div class="form-group">
                <label for="product_name">商品名称 <span style="color: red;">*</span></label>
                <input type="text" class="form-control" id="product_name" name="product_name" 
                       value="{{ report.product_name }}" required>
            </div>
        </div>
        
        <div class="horizontal-layout">
            <div class="form-group">
                <label for="specification">规格</label>
                <input type="text" class="form-control" id="specification" name="specification" 
                       value="{{ report.specification or '' }}">
            </div>
            
            <div class="form-group">
                <label for="product_type">商品类型</label>
                <input type="text" class="form-control" id="product_type" name="product_type" 
                       value="{{ report.product_type or '' }}">
            </div>
            
            <div class="form-group">
                <label for="brand">品牌</label>
                <input type="text" class="form-control" id="brand" name="brand" 
                       value="{{ report.brand or '' }}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="remark">备注</label>
            <textarea class="form-control" id="remark" name="remark" rows="3">{{ report.remark or '' }}</textarea>
        </div>
        
        <div class="form-group" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="margin-right: 10px;">保存</button>
            <a href="{{ url_for('data_report.display_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
