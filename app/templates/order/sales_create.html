{% extends "base.html" %}

{% block title %}创建销售订单{% endblock %}

{% block content %}
<div class="header">
    <h2>创建销售订单</h2>
    <div>
        <button class="btn btn-secondary" onclick="history.back()">返回</button>
        <button class="btn btn-primary" onclick="saveOrder()">保存草稿</button>
        <button class="btn btn-success" onclick="submitOrder()">提交审批</button>
    </div>
</div>

<div class="content-box">
    <form id="orderForm">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="customerType">客户类型 <span class="required">*</span></label>
                    <select id="customerType" class="form-control" onchange="loadCustomers()" required>
                        <option value="">请选择客户类型</option>
                        <option value="terminal">终端客户</option>
                        <option value="distributor">直营商客户</option>
                        <option value="kol">KOL客户</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="customerId">客户 <span class="required">*</span></label>
                    <select id="customerId" class="form-control" onchange="loadCustomerInfo()" required>
                        <option value="">请先选择客户类型</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="warehouse">发货仓库 <span class="required">*</span></label>
                    <select id="warehouse" class="form-control" onchange="loadInventory()" required>
                        <option value="">请选择发货仓库</option>
                        <option value="主仓库">主仓库</option>
                        <option value="分仓库A">分仓库A</option>
                        <option value="分仓库B">分仓库B</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="deliveryDate">交货日期</label>
                    <input type="date" id="deliveryDate" class="form-control">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label>收货地址</label>
                    <input type="text" id="receiverAddress" class="form-control" readonly>
                </div>
            </div>
        </div>

        <div class="order-items">
            <div class="section-header">
                <h4>订单商品</h4>
                <button type="button" class="btn btn-primary btn-sm" onclick="addOrderItem()">+ 添加商品</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered" id="itemsTable">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>规格</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody">
                        <!-- 动态添加商品行 -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="order-summary">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="discountAmount">优惠金额</label>
                        <input type="number" id="discountAmount" class="form-control" value="0" min="0" step="0.01" onchange="calculateTotal()">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="summary-info">
                        <div class="summary-row">
                            <span>商品总金额：</span>
                            <span id="totalAmount">¥0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>优惠金额：</span>
                            <span id="discountDisplay">¥0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>最终金额：</span>
                            <span id="finalAmount">¥0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
let orderItems = [];
let products = [];
let inventory = [];

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadProducts();
    addOrderItem(); // 添加第一行
});

// 加载客户列表
function loadCustomers() {
    const customerType = document.getElementById('customerType').value;
    const customerSelect = document.getElementById('customerId');
    
    customerSelect.innerHTML = '<option value="">请选择客户</option>';
    
    if (!customerType) return;
    
    fetch(`/order/api/customers/${customerType}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                data.data.forEach(customer => {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name;
                    customerSelect.appendChild(option);
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('加载客户列表失败');
        });
}

// 加载客户信息
function loadCustomerInfo() {
    const customerType = document.getElementById('customerType').value;
    const customerId = document.getElementById('customerId').value;
    
    if (!customerType || !customerId) return;
    
    fetch(`/order/api/customers/${customerType}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const customer = data.data.find(c => c.id == customerId);
                if (customer) {
                    document.getElementById('receiverAddress').value = customer.receiver_address || '';
                }
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 加载商品列表
function loadProducts() {
    fetch('/order/api/products')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                products = data.data;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 加载库存
function loadInventory() {
    const warehouse = document.getElementById('warehouse').value;
    if (!warehouse) return;
    
    fetch(`/order/api/inventory/${warehouse}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                inventory = data.data;
                updateProductOptions();
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 更新商品选项
function updateProductOptions() {
    const productSelects = document.querySelectorAll('.product-select');
    productSelects.forEach(select => {
        const currentValue = select.value;
        select.innerHTML = '<option value="">请选择商品</option>';
        
        inventory.forEach(item => {
            if (item.product && item.quantity > 0) {
                const option = document.createElement('option');
                option.value = item.product.id;
                option.textContent = `${item.product.name} (库存: ${item.quantity})`;
                option.dataset.price = item.product.price;
                option.dataset.stock = item.quantity;
                select.appendChild(option);
            }
        });
        
        if (currentValue) {
            select.value = currentValue;
        }
    });
}

// 添加订单项
function addOrderItem() {
    const tbody = document.getElementById('itemsTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>
            <select class="form-control product-select" onchange="updateProductInfo(this)">
                <option value="">请选择商品</option>
            </select>
        </td>
        <td><input type="text" class="form-control specification" readonly></td>
        <td><input type="number" class="form-control price" step="0.01" onchange="calculateRowTotal(this)"></td>
        <td><input type="number" class="form-control quantity" min="1" onchange="calculateRowTotal(this)"></td>
        <td><input type="text" class="form-control subtotal" readonly></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeOrderItem(this)">删除</button></td>
    `;
    tbody.appendChild(row);
    
    // 更新商品选项
    updateProductOptions();
}

// 更新商品信息
function updateProductInfo(select) {
    const row = select.closest('tr');
    const productId = select.value;
    const product = products.find(p => p.id == productId);
    
    if (product) {
        row.querySelector('.specification').value = product.specification || '';
        row.querySelector('.price').value = product.price || 0;
        row.querySelector('.quantity').value = 1;
        calculateRowTotal(select);
    }
}

// 计算行小计
function calculateRowTotal(input) {
    const row = input.closest('tr');
    const price = parseFloat(row.querySelector('.price').value) || 0;
    const quantity = parseInt(row.querySelector('.quantity').value) || 0;
    const subtotal = price * quantity;
    
    row.querySelector('.subtotal').value = subtotal.toFixed(2);
    calculateTotal();
}

// 计算总金额
function calculateTotal() {
    let total = 0;
    const rows = document.querySelectorAll('#itemsTableBody tr');
    
    rows.forEach(row => {
        const subtotal = parseFloat(row.querySelector('.subtotal').value) || 0;
        total += subtotal;
    });
    
    const discount = parseFloat(document.getElementById('discountAmount').value) || 0;
    const final = total - discount;
    
    document.getElementById('totalAmount').textContent = `¥${total.toFixed(2)}`;
    document.getElementById('discountDisplay').textContent = `¥${discount.toFixed(2)}`;
    document.getElementById('finalAmount').textContent = `¥${final.toFixed(2)}`;
}

// 删除订单项
function removeOrderItem(button) {
    const row = button.closest('tr');
    row.remove();
    calculateTotal();
}

// 保存订单
function saveOrder() {
    if (!validateForm()) return;
    
    const orderData = getOrderData();
    orderData.status = 'draft';
    
    fetch('/order/api/sales/create', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(orderData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('订单保存成功');
            window.location.href = '/order/sales';
        } else {
            alert('保存失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败');
    });
}

// 提交订单
function submitOrder() {
    if (!validateForm()) return;
    
    const orderData = getOrderData();
    orderData.status = 'pending';
    
    fetch('/order/api/sales/create', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(orderData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('订单提交成功，等待审批');
            window.location.href = '/order/sales';
        } else {
            alert('提交失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('提交失败');
    });
}

// 验证表单
function validateForm() {
    const customerType = document.getElementById('customerType').value;
    const customerId = document.getElementById('customerId').value;
    const warehouse = document.getElementById('warehouse').value;
    
    if (!customerType || !customerId || !warehouse) {
        alert('请填写必填字段');
        return false;
    }
    
    const rows = document.querySelectorAll('#itemsTableBody tr');
    if (rows.length === 0) {
        alert('请至少添加一个商品');
        return false;
    }
    
    let hasValidItem = false;
    rows.forEach(row => {
        const productId = row.querySelector('.product-select').value;
        const quantity = parseInt(row.querySelector('.quantity').value) || 0;
        if (productId && quantity > 0) {
            hasValidItem = true;
        }
    });
    
    if (!hasValidItem) {
        alert('请至少添加一个有效商品');
        return false;
    }
    
    return true;
}

// 获取订单数据
function getOrderData() {
    const items = [];
    const rows = document.querySelectorAll('#itemsTableBody tr');
    
    rows.forEach(row => {
        const productId = row.querySelector('.product-select').value;
        const quantity = parseInt(row.querySelector('.quantity').value) || 0;
        const price = parseFloat(row.querySelector('.price').value) || 0;
        
        if (productId && quantity > 0) {
            const product = products.find(p => p.id == productId);
            items.push({
                product_id: productId,
                product_name: product ? product.name : '',
                specification: product ? product.specification : '',
                quantity: quantity,
                price: price,
                subtotal: price * quantity
            });
        }
    });
    
    return {
        customer_type: document.getElementById('customerType').value,
        customer_id: document.getElementById('customerId').value,
        warehouse: document.getElementById('warehouse').value,
        delivery_date: document.getElementById('deliveryDate').value,
        discount_amount: parseFloat(document.getElementById('discountAmount').value) || 0,
        items: items
    };
}
</script>

<style>
.required {
    color: red;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.order-items {
    margin: 20px 0;
}

.order-summary {
    margin-top: 20px;
    padding: 20px;
    background-color: #f8f9fa;
    border-radius: 5px;
}

.summary-info {
    text-align: right;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 16px;
}

.summary-row.total {
    font-weight: bold;
    font-size: 18px;
    color: #007bff;
    border-top: 1px solid #dee2e6;
    padding-top: 10px;
}

.form-group {
    margin-bottom: 15px;
}

.btn {
    margin-left: 5px;
}
</style>
{% endblock %}
