{% extends "base.html" %}

{% block title %}发货订单详情{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-truck"></i> 发货订单详情
                        <button class="btn btn-secondary btn-sm ml-2" onclick="history.back()">
                            <i class="fas fa-arrow-left"></i> 返回
                        </button>
                    </h3>
                </div>
                <div class="card-body">
                    <div id="loading" class="text-center">
                        <i class="fas fa-spinner fa-spin"></i> 加载中...
                    </div>
                    <div id="order-detail" style="display: none;">
                        <!-- 基本信息 -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <h5><i class="fas fa-info-circle"></i> 基本信息</h5>
                                <hr>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>订单号：</label>
                                    <p class="form-control-plaintext" id="sales_order_no"></p>
                                </div>
                                <div class="form-group">
                                    <label>客户名称：</label>
                                    <p class="form-control-plaintext" id="customer_name"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货单号：</label>
                                    <p class="form-control-plaintext" id="order_no"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货时间：</label>
                                    <p class="form-control-plaintext" id="shipped_at"></p>
                                </div>
                                <div class="form-group">
                                    <label>下单时间：</label>
                                    <p class="form-control-plaintext" id="order_date"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货仓库：</label>
                                    <p class="form-control-plaintext" id="warehouse"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>业务员：</label>
                                    <p class="form-control-plaintext" id="salesman"></p>
                                </div>
                                <div class="form-group">
                                    <label>交货日期：</label>
                                    <p class="form-control-plaintext" id="delivery_date"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货状态：</label>
                                    <p class="form-control-plaintext" id="status"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货人：</label>
                                    <p class="form-control-plaintext" id="shipped_by"></p>
                                </div>
                                <div class="form-group">
                                    <label>发货金额：</label>
                                    <p class="form-control-plaintext" id="total_amount"></p>
                                </div>
                            </div>
                        </div>

                        <!-- 商品明细 -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <h5><i class="fas fa-list"></i> 商品明细</h5>
                                <hr>
                                <div class="table-responsive">
                                    <table class="table table-striped" id="items-table">
                                        <thead>
                                            <tr>
                                                <th>商品名称</th>
                                                <th>商品类型</th>
                                                <th>品牌</th>
                                                <th>规格</th>
                                                <th>单位</th>
                                                <th>订货价</th>
                                                <th>发货数量</th>
                                                <th>发货件数</th>
                                                <th>小计</th>
                                            </tr>
                                        </thead>
                                        <tbody id="items-tbody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 发货信息 -->
                        <div class="row mb-4" id="shipment-section" style="display: none;">
                            <div class="col-12">
                                <h5><i class="fas fa-shipping-fast"></i> 发货信息</h5>
                                <hr>
                                <div class="form-group">
                                    <label>出库备注：</label>
                                    <p class="form-control-plaintext" id="outbound_comment"></p>
                                </div>
                                <div class="form-group">
                                    <label>出库凭证：</label>
                                    <div id="outbound_voucher_preview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 备注 -->
                        <div class="row mb-4" id="remark-section" style="display: none;">
                            <div class="col-12">
                                <h5><i class="fas fa-comment"></i> 备注</h5>
                                <hr>
                                <div class="form-group">
                                    <label>备注：</label>
                                    <p class="form-control-plaintext" id="remark"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const orderId = {{ id }};
    loadOrderDetail(orderId);
});

async function loadOrderDetail(id) {
    try {
        const response = await fetch(`/order/api/delivery/${id}`);
        const result = await response.json();
        
        if (result.success) {
            displayOrderDetail(result.data);
        } else {
            showAlert('加载失败：' + result.message, 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('加载失败', 'error');
    }
}

function displayOrderDetail(order) {
    // 基本信息
    document.getElementById('sales_order_no').textContent = order.sales_order_no || '-';
    document.getElementById('customer_name').textContent = order.customer_name || '-';
    document.getElementById('order_no').textContent = order.order_no || '-';
    document.getElementById('shipped_at').textContent = order.shipped_at ? new Date(order.shipped_at).toLocaleString() : '-';
    document.getElementById('order_date').textContent = order.order_date ? new Date(order.order_date).toLocaleString() : '-';
    document.getElementById('warehouse').textContent = order.warehouse || '-';
    document.getElementById('salesman').textContent = order.salesman || '-';
    document.getElementById('delivery_date').textContent = order.delivery_date || '-';
    document.getElementById('status').innerHTML = getStatusBadge(order.status);
    document.getElementById('shipped_by').textContent = order.shipped_by || '-';
    document.getElementById('total_amount').textContent = order.total_amount ? '¥' + order.total_amount.toFixed(2) : '-';
    
    // 商品明细
    const itemsTbody = document.getElementById('items-tbody');
    if (order.items && order.items.length > 0) {
        itemsTbody.innerHTML = order.items.map(item => `
            <tr>
                <td>${item.product_name || '-'}</td>
                <td>${item.product_type || '-'}</td>
                <td>${item.brand || '-'}</td>
                <td>${item.specification || '-'}</td>
                <td>${item.unit || '-'}</td>
                <td>¥${(item.price || 0).toFixed(2)}</td>
                <td>${item.quantity || 0}</td>
                <td>${item.pieces || '-'}</td>
                <td>¥${((item.price || 0) * (item.quantity || 0)).toFixed(2)}</td>
            </tr>
        `).join('');
    } else {
        itemsTbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无商品</td></tr>';
    }
    
    // 发货信息
    if (order.outbound_comment || order.outbound_voucher) {
        document.getElementById('shipment-section').style.display = 'block';
        document.getElementById('outbound_comment').textContent = order.outbound_comment || '-';
        
        // 出库凭证预览
        const voucherPreview = document.getElementById('outbound_voucher_preview');
        if (order.outbound_voucher) {
            voucherPreview.innerHTML = `<a href="${order.outbound_voucher}" target="_blank" class="btn btn-info btn-sm">
                <i class="fas fa-eye"></i> 查看出库凭证
            </a>`;
        } else {
            voucherPreview.innerHTML = '-';
        }
    }
    
    // 备注
    if (order.remark) {
        document.getElementById('remark-section').style.display = 'block';
        document.getElementById('remark').textContent = order.remark || '-';
    }
    
    // 隐藏加载状态，显示详情
    document.getElementById('loading').style.display = 'none';
    document.getElementById('order-detail').style.display = 'block';
}

function getStatusBadge(status) {
    const statusMap = {
        'pending': '<span class="badge badge-warning">待发货</span>',
        'shipped': '<span class="badge badge-info">已发货</span>',
        'completed': '<span class="badge badge-success">已完成</span>',
        'cancelled': '<span class="badge badge-dark">已取消</span>'
    };
    return statusMap[status] || '<span class="badge badge-light">未知</span>';
}

function showAlert(message, type = 'info') {
    const alertClass = type === 'error' ? 'alert-danger' : 'alert-info';
    const alertHtml = `
        <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        </div>
    `;
    document.querySelector('.card-body').insertAdjacentHTML('afterbegin', alertHtml);
}
</script>
{% endblock %}
