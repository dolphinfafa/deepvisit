{% extends "base.html" %}

{% block title %}创建退货订单{% endblock %}

{% block content %}
<div class="header">
    <h2>创建退货订单</h2>
    <div>
        <button class="btn btn-secondary" onclick="history.back()">返回</button>
        <button class="btn btn-primary" onclick="saveOrder()">保存草稿</button>
        <button class="btn btn-success" onclick="submitOrder()">提交审批</button>
    </div>
</div>

<div class="content-box">
    <form id="returnOrderForm">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="returnType">退货方式 <span class="required">*</span></label>
                    <select id="returnType" class="form-control" onchange="toggleReturnType()" required>
                        <option value="">请选择退货方式</option>
                        <option value="sales_order">关联销售订单退货</option>
                        <option value="direct">选择商品退货</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6" id="salesOrderSection" style="display: none;">
                <div class="form-group">
                    <label for="salesOrderId">关联销售订单</label>
                    <select id="salesOrderId" class="form-control" onchange="loadSalesOrderInfo()">
                        <option value="">请选择销售订单</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="customerType">客户类型 <span class="required">*</span></label>
                    <select id="customerType" class="form-control" onchange="loadCustomers()" required>
                        <option value="">请选择客户类型</option>
                        <option value="terminal">终端客户</option>
                        <option value="distributor">直营商客户</option>
                        <option value="kol">KOL客户</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="customerId">客户 <span class="required">*</span></label>
                    <select id="customerId" class="form-control" onchange="loadCustomerInfo()" required>
                        <option value="">请先选择客户类型</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="warehouse">收货仓库 <span class="required">*</span></label>
                    <select id="warehouse" class="form-control" required>
                        <option value="">请选择收货仓库</option>
                        <option value="主仓库">主仓库</option>
                        <option value="分仓库A">分仓库A</option>
                        <option value="分仓库B">分仓库B</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="returnReason">退货原因</label>
                    <input type="text" id="returnReason" class="form-control" placeholder="请输入退货原因">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label>收货地址</label>
                    <input type="text" id="receiverAddress" class="form-control" readonly>
                </div>
            </div>
        </div>

        <div class="return-items">
            <div class="section-header">
                <h4>退货商品</h4>
                <button type="button" class="btn btn-primary btn-sm" onclick="addReturnItem()" id="addItemBtn" style="display: none;">+ 添加商品</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered" id="itemsTable">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>规格</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody">
                        <!-- 动态添加商品行 -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="order-summary">
            <div class="row">
                <div class="col-md-6">
                    <div class="summary-info">
                        <div class="summary-row total">
                            <span>退货总金额：</span>
                            <span id="totalAmount">¥0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
let returnItems = [];
let products = [];
let salesOrders = [];

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadProducts();
});

// 切换退货方式
function toggleReturnType() {
    const returnType = document.getElementById('returnType').value;
    const salesOrderSection = document.getElementById('salesOrderSection');
    const addItemBtn = document.getElementById('addItemBtn');
    
    if (returnType === 'sales_order') {
        salesOrderSection.style.display = 'block';
        addItemBtn.style.display = 'none';
        // 清空商品列表
        document.getElementById('itemsTableBody').innerHTML = '';
        returnItems = [];
        calculateTotal();
    } else if (returnType === 'direct') {
        salesOrderSection.style.display = 'none';
        addItemBtn.style.display = 'inline-block';
        // 清空销售订单选择
        document.getElementById('salesOrderId').innerHTML = '<option value="">请选择销售订单</option>';
        if (returnItems.length === 0) {
            addReturnItem();
        }
    }
}

// 加载客户列表
function loadCustomers() {
    const customerType = document.getElementById('customerType').value;
    const customerSelect = document.getElementById('customerId');
    
    customerSelect.innerHTML = '<option value="">请选择客户</option>';
    
    if (!customerType) return;
    
    fetch(`/order/api/customers/${customerType}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                data.data.forEach(customer => {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name;
                    customerSelect.appendChild(option);
                });
                
                // 如果是关联销售订单退货，加载该客户的销售订单
                const returnType = document.getElementById('returnType').value;
                if (returnType === 'sales_order') {
                    loadCustomerSalesOrders();
                }
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('加载客户列表失败');
        });
}

// 加载客户信息
function loadCustomerInfo() {
    const customerType = document.getElementById('customerType').value;
    const customerId = document.getElementById('customerId').value;
    
    if (!customerType || !customerId) return;
    
    fetch(`/order/api/customers/${customerType}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const customer = data.data.find(c => c.id == customerId);
                if (customer) {
                    document.getElementById('receiverAddress').value = customer.receiver_address || '';
                }
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    
    // 如果是关联销售订单退货，加载该客户的销售订单
    const returnType = document.getElementById('returnType').value;
    if (returnType === 'sales_order') {
        loadCustomerSalesOrders();
    }
}

// 加载客户的销售订单
function loadCustomerSalesOrders() {
    const customerType = document.getElementById('customerType').value;
    const customerId = document.getElementById('customerId').value;
    
    if (!customerType || !customerId) return;
    
    fetch(`/order/api/sales-orders/${customerType}/${customerId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const salesOrderSelect = document.getElementById('salesOrderId');
                salesOrderSelect.innerHTML = '<option value="">请选择销售订单</option>';
                
                data.data.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.id;
                    option.textContent = `${order.order_no} - ${order.customer_name}`;
                    salesOrderSelect.appendChild(option);
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 加载销售订单信息
function loadSalesOrderInfo() {
    const salesOrderId = document.getElementById('salesOrderId').value;
    
    if (!salesOrderId) return;
    
    fetch(`/order/api/sales/${salesOrderId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const order = data.data;
                
                // 自动填充客户信息
                document.getElementById('customerType').value = order.customer_type;
                document.getElementById('customerId').value = order.customer_id;
                document.getElementById('receiverAddress').value = order.receiver_address || '';
                
                // 加载客户列表以确保客户选择正确
                loadCustomers();
                
                // 加载订单商品
                loadOrderItems(order.items);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 加载订单商品
function loadOrderItems(items) {
    const tbody = document.getElementById('itemsTableBody');
    tbody.innerHTML = '';
    returnItems = [];
    
    if (items && items.length > 0) {
        items.forEach(item => {
            addReturnItemFromOrder(item);
        });
    }
    
    calculateTotal();
}

// 从订单添加退货商品
function addReturnItemFromOrder(orderItem) {
    const tbody = document.getElementById('itemsTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>
            <input type="text" class="form-control product-name" value="${orderItem.product_name}" readonly>
            <input type="hidden" class="product-id" value="${orderItem.product_id}">
        </td>
        <td><input type="text" class="form-control specification" value="${orderItem.specification || ''}" readonly></td>
        <td><input type="number" class="form-control price" step="0.01" value="${orderItem.price}" onchange="calculateRowTotal(this)"></td>
        <td><input type="number" class="form-control quantity" min="1" max="${orderItem.quantity}" value="${orderItem.quantity}" onchange="calculateRowTotal(this)"></td>
        <td><input type="text" class="form-control subtotal" readonly></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeReturnItem(this)">删除</button></td>
    `;
    tbody.appendChild(row);
    
    // 计算行小计
    calculateRowTotal(row.querySelector('.quantity'));
}

// 加载商品列表
function loadProducts() {
    fetch('/order/api/products')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                products = data.data;
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
}

// 添加退货商品
function addReturnItem() {
    const tbody = document.getElementById('itemsTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>
            <select class="form-control product-select" onchange="updateProductInfo(this)">
                <option value="">请选择商品</option>
            </select>
        </td>
        <td><input type="text" class="form-control specification" readonly></td>
        <td><input type="number" class="form-control price" step="0.01" onchange="calculateRowTotal(this)"></td>
        <td><input type="number" class="form-control quantity" min="1" onchange="calculateRowTotal(this)"></td>
        <td><input type="text" class="form-control subtotal" readonly></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeReturnItem(this)">删除</button></td>
    `;
    tbody.appendChild(row);
    
    // 更新商品选项
    updateProductOptions();
}

// 更新商品选项
function updateProductOptions() {
    const productSelects = document.querySelectorAll('.product-select');
    productSelects.forEach(select => {
        const currentValue = select.value;
        select.innerHTML = '<option value="">请选择商品</option>';
        
        products.forEach(product => {
            const option = document.createElement('option');
            option.value = product.id;
            option.textContent = product.name;
            option.dataset.price = product.price;
            option.dataset.specification = product.specification || '';
            select.appendChild(option);
        });
        
        if (currentValue) {
            select.value = currentValue;
        }
    });
}

// 更新商品信息
function updateProductInfo(select) {
    const row = select.closest('tr');
    const productId = select.value;
    const product = products.find(p => p.id == productId);
    
    if (product) {
        row.querySelector('.specification').value = product.specification || '';
        row.querySelector('.price').value = product.price || 0;
        row.querySelector('.quantity').value = 1;
        calculateRowTotal(select);
    }
}

// 计算行小计
function calculateRowTotal(input) {
    const row = input.closest('tr');
    const price = parseFloat(row.querySelector('.price').value) || 0;
    const quantity = parseInt(row.querySelector('.quantity').value) || 0;
    const subtotal = price * quantity;
    
    row.querySelector('.subtotal').value = subtotal.toFixed(2);
    calculateTotal();
}

// 计算总金额
function calculateTotal() {
    let total = 0;
    const rows = document.querySelectorAll('#itemsTableBody tr');
    
    rows.forEach(row => {
        const subtotal = parseFloat(row.querySelector('.subtotal').value) || 0;
        total += subtotal;
    });
    
    document.getElementById('totalAmount').textContent = `¥${total.toFixed(2)}`;
}

// 删除退货商品
function removeReturnItem(button) {
    const row = button.closest('tr');
    row.remove();
    calculateTotal();
}

// 保存订单
function saveOrder() {
    if (!validateForm()) return;
    
    const orderData = getOrderData();
    orderData.status = 'draft';
    
    fetch('/order/api/return/create', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(orderData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('退货订单保存成功');
            window.location.href = '/order/return';
        } else {
            alert('保存失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('保存失败');
    });
}

// 提交订单
function submitOrder() {
    if (!validateForm()) return;
    
    const orderData = getOrderData();
    orderData.status = 'pending';
    
    fetch('/order/api/return/create', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(orderData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('退货订单提交成功，等待审批');
            window.location.href = '/order/return';
        } else {
            alert('提交失败: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('提交失败');
    });
}

// 验证表单
function validateForm() {
    const returnType = document.getElementById('returnType').value;
    const customerType = document.getElementById('customerType').value;
    const customerId = document.getElementById('customerId').value;
    const warehouse = document.getElementById('warehouse').value;
    
    if (!returnType || !customerType || !customerId || !warehouse) {
        alert('请填写必填字段');
        return false;
    }
    
    if (returnType === 'sales_order') {
        const salesOrderId = document.getElementById('salesOrderId').value;
        if (!salesOrderId) {
            alert('请选择关联的销售订单');
            return false;
        }
    }
    
    const rows = document.querySelectorAll('#itemsTableBody tr');
    if (rows.length === 0) {
        alert('请至少添加一个退货商品');
        return false;
    }
    
    let hasValidItem = false;
    rows.forEach(row => {
        const productId = row.querySelector('.product-id') ? row.querySelector('.product-id').value : row.querySelector('.product-select').value;
        const quantity = parseInt(row.querySelector('.quantity').value) || 0;
        if (productId && quantity > 0) {
            hasValidItem = true;
        }
    });
    
    if (!hasValidItem) {
        alert('请至少添加一个有效退货商品');
        return false;
    }
    
    return true;
}

// 获取订单数据
function getOrderData() {
    const items = [];
    const rows = document.querySelectorAll('#itemsTableBody tr');
    
    rows.forEach(row => {
        const productId = row.querySelector('.product-id') ? row.querySelector('.product-id').value : row.querySelector('.product-select').value;
        const productName = row.querySelector('.product-name') ? row.querySelector('.product-name').value : '';
        const specification = row.querySelector('.specification').value;
        const quantity = parseInt(row.querySelector('.quantity').value) || 0;
        const price = parseFloat(row.querySelector('.price').value) || 0;
        
        if (productId && quantity > 0) {
            items.push({
                product_id: productId,
                product_name: productName,
                specification: specification,
                quantity: quantity,
                price: price,
                subtotal: price * quantity
            });
        }
    });
    
    return {
        return_type: document.getElementById('returnType').value,
        sales_order_id: document.getElementById('salesOrderId').value || null,
        customer_type: document.getElementById('customerType').value,
        customer_id: document.getElementById('customerId').value,
        warehouse: document.getElementById('warehouse').value,
        return_reason: document.getElementById('returnReason').value,
        items: items
    };
}
</script>

<style>
.required {
    color: red;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.return-items {
    margin: 20px 0;
}

.order-summary {
    margin-top: 20px;
    padding: 20px;
    background-color: #f8f9fa;
    border-radius: 5px;
}

.summary-info {
    text-align: right;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 16px;
}

.summary-row.total {
    font-weight: bold;
    font-size: 18px;
    color: #dc3545;
    border-top: 1px solid #dee2e6;
    padding-top: 10px;
}

.form-group {
    margin-bottom: 15px;
}

.btn {
    margin-left: 5px;
}
</style>
{% endblock %}
